[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "betasolver"
version = "0.0.1"
description = "Finding a climbing beta with optimization: state-check LPs plus a two-stage Dijkstra search."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
exact = ["cvxpy>=1.4", "clarabel>=0.6"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
